name: udpxy_Checker

on:
  schedule:
    - cron: '0 22,10 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install requests pypinyin

      - name: IP检测
        id: ip_check
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          # 精确测试，检测全部服务器，最低速度 300 KB/s，忽略错误码
          python udpxy_checker.py --auto -m precise -n 0 --min-speed 300 || true

      - name: 更新IP检测结果
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ip/
          git add logs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update ip_check_data at $(date +'%Y-%m-%d %H:%M:%S')" || echo "无变更，跳过提交"
          git push

      - name: 查看失败城市
        if: always()
        run: |
          echo "=========================================="
          echo "失败城市列表"
          echo "=========================================="
          if [ -f logs/failed_cities_precise.txt ]; then
            cat logs/failed_cities_precise.txt
            echo "=========================================="
            echo "失败原因: 城市缺少组播地址配置"
            echo "请检查 config/city_config.json"
          else
            echo "无失败城市记录"
          fi