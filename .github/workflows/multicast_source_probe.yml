name: Multicast Source Probe

on:
  schedule:
    # 每天凌晨 3:00 执行
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  source-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Create necessary directories
        run: |
          mkdir -p rtp ip logs
      
      - name: Run multicast source probe
        run: |
          echo "=========================================="
          echo "Auto update multicast_source_probe at $(date +'%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          echo "" | python scripts/multicast_source_probe.py
      
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add rtp/*_probe.txt logs/ -A 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto update multicast_probe at $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main || true
          git push