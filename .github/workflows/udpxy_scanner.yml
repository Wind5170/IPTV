name: udpxy_Scanner

on:
  schedule:
    # 每天 23:00 执行
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: 扫描udpxy服务器
        id: scanner
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          python udpxy_source_scanner.py --auto  

      - name: 更新扫描结果
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ip/
          if git diff --quiet && git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "Auto update ip_data at $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 查看扫描结果
        if: always()
        run: |
          echo "=========================================="
          echo "扫描完成"
          echo "=========================================="
          echo "配置文件列表:"
          ls -la ip/*_config.txt 2>/dev/null | wc -l || echo "无配置文件"
          echo ""
          echo "IP结果文件列表:"
          ls -la ip/*_ip.txt 2>/dev/null | head -20 || echo "无结果文件"