name: Multicast Quick Check

on:
  schedule:
    # 每天凌晨 4:00 执行
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  quick-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create necessary directories
        run: |
          mkdir -p rtp ip logs
      
      - name: Run multicast quick check
        run: |
          python multicast_quick_check.py --auto
      
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add rtp/*_quick.txt logs/ -A 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto update multicast_check_data at $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main || true
          git push